# plugin/apps/research-brief/app.yaml — the tool app_research_brief.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Research brief
description: "Use after writing a research brief, in the console only: shows the owner the brief, each claim with its confidence and sources, without waiting, so they can comment and pick claims to dig into."
mode: show
input:
  type: object
  required: [title, brief]
  properties:
    title:
      type: string
      description: The question.
    brief:
      type: string
      description: The brief from step 5, Markdown.
    claims:
      type: array
      items:
        type: object
        required: [id, title]
        properties:
          id:
            type: string
          title:
            type: string
            description: The claim.
          confidence:
            type: string
            description: high, medium or low.
          sources:
            type: array
            items:
              type: object
              required: [url]
              properties:
                title:
                  type: string
                url:
                  type: string
    ref:
      type: string
      description: Anything you need to pick this up later (repository, issue URL, run id). It comes back with the decision.
actions:
  - { id: dig, label: Dig into selected, tone: primary, note: optional }
  - { id: follow_up, label: Ask a follow-up, tone: neutral, note: required }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
    claims:
      type: string
      title: Claims
      description: JSON array of the ids the owner selected.
      maxLength: 8000
    ref:
      type: string
      title: Reference
      description: The ref the call passed, echoed back.
      maxLength: 2000
