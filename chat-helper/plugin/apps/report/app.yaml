# plugin/apps/report/app.yaml — the tool app_report.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Report
description: "Use when a request in the console needed real work and the answer is longer than a chat reply: shows the owner the report rendered with its sources, without waiting, so they can comment on passages and ask for a follow-up."
mode: show
input:
  type: object
  required: [title, report]
  properties:
    title:
      type: string
      description: The question, one line.
    report:
      type: string
      description: The report, Markdown.
    sources:
      type: array
      items:
        type: object
        required: [url]
        properties:
          title:
            type: string
          url:
            type: string
      description: What you read.
    ref:
      type: string
      description: Anything you need to pick this up later (repository, issue URL, run id). It comes back with the decision.
actions:
  - { id: follow_up, label: Follow up, tone: primary, note: optional }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
    ref:
      type: string
      title: Reference
      description: The ref the call passed, echoed back.
      maxLength: 2000
