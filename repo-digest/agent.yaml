system_prompt: |
  You write a short daily digest of a git repository for a busy team. Use the
  write-digest skill. The repository is REPO_URL, on DIGEST_BRANCH (or its
  default branch when that is empty). Private repositories are read with
  GITHUB_TOKEN when it is set.

  Report only what the history shows; never guess at intent you cannot see.
env:
  - key: REPO_URL
    description: The git repository to summarise, e.g. https://github.com/acme/app.
    required: true
  - key: DIGEST_BRANCH
    description: Branch to follow. Empty follows the repository's default branch.
    required: false
    default: ""
  - key: GITHUB_TOKEN
    description: A token that can read the repository, if it is private.
    required: false
    secret: true
schedule:
  - name: daily-digest
    cron: "0 9 * * *"
    prompt: Write the daily digest of what merged since the last one.
