# plugin/apps/issue-triage/app.yaml — the tool app_issue_triage.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Issue triage
description: "Use before posting a triage comment on a new issue: shows the owner its type, severity, suggested labels, possible duplicates and what is missing, lets them pick labels, mark a duplicate and edit the reply, and returns whether to post."
mode: gate
input:
  type: object
  required: [title, reply]
  properties:
    title:
      type: string
      description: The issue's title.
    url:
      type: string
    repo:
      type: string
    number:
      type: integer
    type:
      type: string
      description: bug, feature, question, docs or chore.
    severity:
      type: string
      description: "critical, high, medium or low; bugs only."
    labels:
      type: array
      items:
        type: object
        required: [id]
        properties:
          id:
            type: string
            description: The label's exact name.
          why:
            type: string
      description: Labels you suggest.
    duplicates:
      type: array
      items:
        type: object
        required: [id]
        properties:
          id:
            type: string
            description: Issue number.
          title:
            type: string
          url:
            type: string
          why:
            type: string
            description: Why it looks the same.
    missing:
      type: array
      items:
        type: object
        required: [title]
        properties:
          id:
            type: string
          title:
            type: string
            description: What is missing, as the question to the reporter.
    reply:
      type: string
      description: The comment you would post, Markdown.
actions:
  - { id: post, label: Post reply, tone: primary }
  - { id: duplicate, label: Post as duplicate, tone: neutral }
  - { id: hold, label: Don't post, tone: neutral }
fields:
  type: object
  properties:
    labels:
      type: string
      title: Labels
      description: JSON array of the ids the owner chosen.
      maxLength: 8000
    duplicates:
      type: string
      title: Possible duplicates
      description: JSON array of the ids the owner marked.
      maxLength: 8000
    reply:
      type: string
      title: Reply
      description: "The owner's edit; absent when unchanged."
      maxLength: 20000
