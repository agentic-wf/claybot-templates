# plugin/apps/meeting-summary/app.yaml — the tool app_meeting_summary.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Meeting summary
description: "Use before filing a meeting summary, in the console only: shows the owner the decisions, action items with owners and dates, and open questions, lets them comment on any line, and returns whether to file it."
mode: gate
input:
  type: object
  required: [title]
  properties:
    title:
      type: string
      description: The meeting.
    date:
      type: string
      description: YYYY-MM-DD.
    people:
      type: array
      items:
        type: string
    decisions:
      type: array
      items:
        type: object
        required: [title]
        properties:
          id:
            type: string
          title:
            type: string
            description: The decision.
    actions:
      type: array
      items:
        type: object
        required: [title]
        properties:
          id:
            type: string
          title:
            type: string
            description: The task.
          owner:
            type: string
            description: "Only as said; empty when nobody was named."
          due:
            type: string
    questions:
      type: array
      items:
        type: object
        required: [title]
        properties:
          id:
            type: string
          title:
            type: string
actions:
  - { id: file, label: File it, tone: primary }
  - { id: revise, label: Fix first, tone: neutral, note: optional }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
