# plugin/apps/alert-triage/app.yaml — the tool app_alert_triage.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Alert triage
description: "Use after writing an alert's triage note, in the console only: shows the owner the rating, the recent changes it may tie to and the checks to run, without waiting, so they can ask you to dig deeper or mark a false alarm later."
mode: show
input:
  type: object
  required: [title, summary]
  properties:
    title:
      type: string
      description: The alert, one line.
    severity:
      type: string
      description: sev1, sev2 or sev3, from step 3.
    source:
      type: string
      description: pagerduty, datadog or grafana.
    url:
      type: string
      description: The alert in its tool.
    summary:
      type: string
      description: Your note from step 5, Markdown.
    changes:
      type: array
      items:
        type: object
        required: [title]
        properties:
          id:
            type: string
          title:
            type: string
          url:
            type: string
          when:
            type: string
          why:
            type: string
            description: Why it could be the cause.
      description: Recent changes that could explain it.
    next:
      type: array
      items:
        type: object
        required: [name]
        properties:
          name:
            type: string
            description: A check or step for a person.
          detail:
            type: string
          url:
            type: string
    ref:
      type: string
      description: Anything you need to pick this up later (repository, issue URL, run id). It comes back with the decision.
actions:
  - { id: dig, label: Dig deeper, tone: primary, note: optional }
  - { id: false_alarm, label: False alarm, tone: neutral, note: required }
  - { id: escalate, label: Draft an escalation, tone: neutral, note: optional }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
    ref:
      type: string
      title: Reference
      description: The ref the call passed, echoed back.
      maxLength: 2000
