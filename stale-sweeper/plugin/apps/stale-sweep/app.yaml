# plugin/apps/stale-sweep/app.yaml — the tool app_stale_sweep.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Stale items
description: "Use after a sweep, in the console only: lists the items that stayed silent after a nudge, without waiting, so the owner can pick which to close or keep open."
mode: show
input:
  type: object
  required: [title, items]
  properties:
    title:
      type: string
      description: "<repository>: n items ready to close."
    items:
      type: array
      items:
        type: object
        required: [id, title]
        properties:
          id:
            type: string
            description: Issue or PR number.
          title:
            type: string
          url:
            type: string
          kind:
            type: string
            description: issue or pr.
          quiet:
            type: string
            description: How long it has been quiet.
          nudged:
            type: string
            description: When you nudged it.
    ref:
      type: string
      description: Anything you need to pick this up later (repository, issue URL, run id). It comes back with the decision.
actions:
  - { id: close, label: Close selected, tone: danger, note: optional }
  - { id: keep_open, label: Keep selected open, tone: neutral }
fields:
  type: object
  properties:
    items:
      type: string
      title: Silent after a nudge
      description: JSON array of the ids the owner selected.
      maxLength: 8000
    ref:
      type: string
      title: Reference
      description: The ref the call passed, echoed back.
      maxLength: 2000
