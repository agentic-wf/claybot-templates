# plugin/apps/edit-review/app.yaml — the tool app_edit_review.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Edits
description: "Use when returning an edited draft in the console: shows the owner each change beside the original with why, and the whole revision, lets them reject changes and comment on passages, and returns whether to use it."
mode: gate
input:
  type: object
  required: [title, changes, revision]
  properties:
    title:
      type: string
      description: What the draft is.
    changes:
      type: array
      items:
        type: object
        required: [id]
        properties:
          id:
            type: string
          before:
            type: string
            description: The original wording.
          after:
            type: string
            description: Your wording.
          why:
            type: string
            description: One line.
    revision:
      type: string
      description: The whole revised draft with every change applied, Markdown.
actions:
  - { id: accept, label: Use these edits, tone: primary }
  - { id: revise, label: Revise, tone: neutral, note: optional }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
    accepted:
      type: string
      title: Changes
      description: JSON array of the ids the owner accepted.
      maxLength: 8000
