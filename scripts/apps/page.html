<!doctype html>
<!--
  plugin/apps/{{NAME}}/app.html: the view for app.yaml beside it.
  Generated by scripts/apps/build.py from scripts/apps/lib.js; edit those and
  rebuild rather than this file, so every app in the catalog stays in step.
  One file, no build step at runtime: nothing outside it loads.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  /* The host passes its theme in as these variables; the values here are
     only fallbacks. Every colour goes through them, so the card reads in
     light and dark. */
  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f7f7f5;
    --color-text-primary: #292524;
    --color-text-secondary: #57534e;
    --color-border-primary: #e7e5e4;
    --color-accent: #0f766e;
    --color-accent-contrast: #ffffff;
    --color-danger: #b91c1c;
    --color-warn: #b45309;
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --color-background-primary: #1c1917;
    --color-background-secondary: #0c0a09;
    --color-text-primary: #f5f5f4;
    --color-text-secondary: #a8a29e;
    --color-border-primary: #44403c;
    --color-accent: #2dd4bf;
    --color-accent-contrast: #0c0a09;
    --color-danger: #f87171;
    --color-warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font: 14px/1.5 var(--font-sans); color: var(--color-text-primary); padding: 2px; overflow-wrap: anywhere; }
  h1 { font-size: 16px; margin: 0; line-height: 1.35; }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-secondary); margin: 0 0 6px; }
  p { margin: 0; }
  .stack, main { display: flex; flex-direction: column; gap: 14px; }
  .head { display: flex; flex-direction: column; gap: 4px; }
  .sec { display: flex; flex-direction: column; gap: 8px; }
  details.sec > summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; flex-wrap: nowrap; align-items: flex-start; }
  .row.end { justify-content: flex-end; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--color-text-secondary); font-size: 13px; }
  .hint { font-size: 12px; margin-top: -4px; }
  .mono, code, pre { font-family: var(--font-mono); font-size: 12.5px; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; justify-content: flex-end; flex-shrink: 0; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--color-border-primary); color: var(--color-text-secondary); white-space: nowrap; }
  .chip.bad { color: var(--color-danger); border-color: currentColor; }
  .chip.warn { color: var(--color-warn); border-color: currentColor; }
  .chip.ok { color: var(--color-accent); border-color: currentColor; }
  .item { border: 1px solid var(--color-border-primary); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--color-background-primary); }
  .item.off { opacity: .55; }
  .line { padding: 6px 0; border-bottom: 1px solid var(--color-border-primary); }
  .line:last-child { border-bottom: 0; }
  a.link { color: var(--color-accent); text-decoration: none; font-weight: 600; }
  a.link:hover { text-decoration: underline; }
  .check { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; min-height: 28px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--color-accent); margin: 0; cursor: pointer; }
  .scroll { overflow-x: auto; }
  pre.code { margin: 0; padding: 8px 10px; background: var(--color-background-secondary); border-radius: 8px; overflow-x: auto; white-space: pre; }
  :not(pre) > code { background: var(--color-background-secondary); padding: 0 4px; border-radius: 4px; }
  .md { display: flex; flex-direction: column; }
  .mdrow { display: flex; gap: 6px; align-items: flex-start; border-left: 3px solid transparent; padding-left: 8px; margin-left: -11px; }
  .mdrow.changed { border-left-color: var(--color-accent); }
  .mdcell { flex: 1; min-width: 0; padding: 3px 0; }
  .mdh { font-weight: 700; margin-top: 6px; }
  .mdh.h1 { font-size: 16px; } .mdh.h2 { font-size: 15px; } .mdh.h3, .mdh.h4 { font-size: 14px; }
  .mdli { padding-left: 16px; position: relative; }
  .mdli::before { content: "•"; position: absolute; left: 4px; color: var(--color-text-secondary); }
  .mdli.in { margin-left: 16px; }
  .mdq, blockquote.quote { margin: 0; padding-left: 10px; border-left: 3px solid var(--color-border-primary); color: var(--color-text-secondary); }
  .mdtable { border-collapse: collapse; font-size: 13px; }
  .mdtable th, .mdtable td { border: 1px solid var(--color-border-primary); padding: 3px 8px; text-align: left; vertical-align: top; }
  .removed summary { cursor: pointer; font-size: 12px; color: var(--color-text-secondary); padding: 4px 0; }
  .del { text-decoration: line-through; color: var(--color-danger); }
  .ins { color: var(--color-accent); }
  details.file { border: 1px solid var(--color-border-primary); border-radius: 10px; overflow: hidden; background: var(--color-background-primary); }
  .filehead { display: flex; gap: 10px; align-items: center; padding: 6px 10px; cursor: pointer; background: var(--color-background-secondary); font-size: 13px; }
  .filehead .mono { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats { display: inline-flex; gap: 6px; font-family: var(--font-mono); font-size: 12px; }
  .plus { color: var(--color-accent); } .minus { color: var(--color-danger); }
  .difft { font-family: var(--font-mono); font-size: 12px; line-height: 1.55; min-width: max-content; }
  .dl { display: grid; grid-template-columns: 40px 40px 16px 1fr; white-space: pre; }
  .dl.hunk { display: block; padding: 2px 10px; color: var(--color-text-secondary); background: var(--color-background-secondary); }
  .dn { text-align: right; padding-right: 6px; color: var(--color-text-secondary); opacity: .7; user-select: none; }
  .ds { text-align: center; user-select: none; }
  .dt { padding-right: 12px; }
  .dl.add { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
  .dl.del { background: color-mix(in srgb, var(--color-danger) 12%, transparent); text-decoration: none; color: inherit; }
  .pick { cursor: pointer; }
  .pick:hover, .pick:focus-visible { outline: 1px solid var(--color-accent); outline-offset: -1px; }
  .thread { display: flex; flex-direction: column; gap: 6px; }
  .thread:empty { display: none; }
  .difft .thread, .md .thread { padding: 6px 10px; font-family: var(--font-sans); font-size: 13px; white-space: normal; }
  .composer, .bubble { border: 1px solid var(--color-border-primary); border-radius: 10px; padding: 8px 10px; background: var(--color-background-primary); display: flex; flex-direction: column; gap: 6px; position: relative; }
  .bubble { border-color: var(--color-accent); padding-right: 32px; }
  .bubble .x { position: absolute; top: 2px; right: 2px; min-height: 28px; width: 28px; padding: 0; border: 0; background: none; color: var(--color-text-secondary); font-size: 16px; }
  .cbtn { flex-shrink: 0; min-height: 26px; width: 26px; padding: 0; border-radius: 8px; font-size: 15px; line-height: 1; color: var(--color-text-secondary); opacity: .6; }
  .mdrow:hover .cbtn, .item:hover .cbtn, .cbtn:focus-visible { opacity: 1; }
  @media (pointer: coarse) { .cbtn { min-height: 36px; width: 36px; opacity: 1; } .check { min-width: 40px; min-height: 40px; } }
  .timeline { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .timeline li { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; }
  .kv dt { color: var(--color-text-secondary); } .kv dd { margin: 0; }
  .src { font-size: 13px; }
  textarea { width: 100%; font: inherit; color: inherit; background: var(--color-background-primary); border: 1px solid var(--color-border-primary); border-radius: 10px; padding: 8px 10px; resize: vertical; }
  textarea.edit { font-family: var(--font-mono); font-size: 13px; min-height: 96px; }
  /* Buttons are at least 44px tall: the card is also a sheet on a phone. */
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 16px; border-radius: 999px; cursor: pointer; border: 1px solid var(--color-border-primary); background: var(--color-background-primary); color: var(--color-text-primary); }
  button.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
  button.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-contrast); }
  button.danger { color: var(--color-danger); border-color: currentColor; }
  button[disabled] { opacity: .55; cursor: default; }
  .foot { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--color-border-primary); padding-top: 12px; }
  .error { color: var(--color-danger); font-size: 13px; }
  #done { font-weight: 600; }
  .finished .cbtn, .finished .composer { display: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="app" class="stack"></div>
  <div class="foot">
    <p id="tally" class="muted"></p>
    <div id="note-wrap" hidden>
      <label for="note" class="muted" id="note-label">Note</label>
      <textarea id="note" rows="3"></textarea>
    </div>
    <div id="actions" class="row"></div>
    <p id="error" class="error" role="alert" hidden></p>
    <p id="done" hidden></p>
  </div>
</main>
<script>
;(function () {
{{PROTOCOL}}

  var APP = {{APP}}

{{LIB}}
})()
</script>
</body>
</html>
