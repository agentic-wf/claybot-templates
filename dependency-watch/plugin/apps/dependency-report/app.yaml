# plugin/apps/dependency-report/app.yaml — the tool app_dependency_report.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Dependency report
description: "Use after updating the dependency report, in the console only: shows the owner each finding ranked by risk with its fix version and advisory, without waiting, so they can accept a risk or ask for a re-check later."
mode: show
input:
  type: object
  required: [title, deps]
  properties:
    title:
      type: string
      description: "<repository>: one line on what changed since the last check."
    url:
      type: string
      description: The Dependency report issue.
    deps:
      type: array
      items:
        type: object
        required: [id, title]
        properties:
          id:
            type: string
            description: "<ecosystem>:<package>"
          title:
            type: string
            description: "package current -> fixed"
          risk:
            type: string
            description: critical, high, medium or low.
          kind:
            type: string
            description: vulnerable, major or minor.
          advisory:
            type: string
          url:
            type: string
          reachable:
            type: string
            description: yes, no or unknown.
    ref:
      type: string
      description: Anything you need to pick this up later (repository, issue URL, run id). It comes back with the decision.
actions:
  - { id: accept_risk, label: Accept risk for selected, tone: danger, note: required }
  - { id: recheck, label: Check again now, tone: neutral }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
    deps:
      type: string
      title: Dependencies
      description: JSON array of the ids the owner selected.
      maxLength: 8000
    ref:
      type: string
      title: Reference
      description: The ref the call passed, echoed back.
      maxLength: 2000
