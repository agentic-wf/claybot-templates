# plugin/apps/test-results/app.yaml — the tool app_test_results.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Tests to add
description: "Use before opening a pull request with new tests: shows the owner the run's result, each test and what it covers, and the test files' diffs, lets them drop tests and comment on lines, and returns whether to open the pull request."
mode: gate
input:
  type: object
  required: [title, tests]
  properties:
    title:
      type: string
      description: The pull request the tests are for.
    url:
      type: string
    repo:
      type: string
    number:
      type: integer
    run:
      type: object
      properties:
        command:
          type: string
        passed:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        output:
          type: string
          description: The last 80 lines of output.
    tests:
      type: array
      items:
        type: object
        required: [id]
        properties:
          id:
            type: string
            description: The test's name.
          file:
            type: string
          covers:
            type: string
            description: The behaviour it proves, one line.
          status:
            type: string
            description: pass or fail.
    files:
      type: array
      items:
        type: object
        required: [path, patch]
        properties:
          path:
            type: string
          patch:
            type: string
            description: "Unified diff of this file, @@ headers included."
          url:
            type: string
          status:
            type: string
            description: added, modified, removed or renamed.
      description: The test files' diffs.
actions:
  - { id: open_pr, label: Open the tests PR, tone: primary }
  - { id: revise, label: Change first, tone: neutral, note: optional }
  - { id: discard, label: Discard, tone: neutral, note: optional }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
    keep:
      type: string
      title: Tests
      description: JSON array of the ids the owner kept.
      maxLength: 8000
