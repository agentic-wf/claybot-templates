# plugin/apps/weekly-report/app.yaml — the tool app_weekly_report.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Weekly report
description: "Use after writing the weekly report, in the console only: shows what shipped, what is stuck and what needs a decision, without waiting, so the owner can pick items to discuss."
mode: show
input:
  type: object
  required: [title]
  properties:
    title:
      type: string
      description: "Week of <date>."
    summary:
      type: string
      description: The report's opening, Markdown.
    shipped:
      type: array
      items:
        type: object
        required: [title]
        properties:
          id:
            type: string
          title:
            type: string
          url:
            type: string
          repo:
            type: string
    stuck:
      type: array
      items:
        type: object
        required: [id, title]
        properties:
          id:
            type: string
          title:
            type: string
          url:
            type: string
          repo:
            type: string
          why:
            type: string
    decisions:
      type: array
      items:
        type: object
        required: [id, title]
        properties:
          id:
            type: string
          title:
            type: string
          url:
            type: string
    ref:
      type: string
      description: Anything you need to pick this up later (repository, issue URL, run id). It comes back with the decision.
actions:
  - { id: discuss, label: Discuss selected, tone: primary, note: optional }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
    stuck:
      type: string
      title: Stuck
      description: JSON array of the ids the owner selected.
      maxLength: 8000
    ref:
      type: string
      title: Reference
      description: The ref the call passed, echoed back.
      maxLength: 2000
