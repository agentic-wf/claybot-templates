# plugin/apps/postmortem/app.yaml — the tool app_postmortem.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Postmortem
description: "Use before saving an incident's postmortem, in the console only: shows the owner the draft rendered beside the timeline, lets them comment on any passage, and returns whether to file it or revise."
mode: gate
input:
  type: object
  required: [title, doc]
  properties:
    title:
      type: string
      description: The incident.
    doc:
      type: string
      description: The postmortem draft, Markdown.
    timeline:
      type: array
      items:
        type: object
        required: [what]
        properties:
          at:
            type: string
            description: "HH:MM"
          who:
            type: string
          what:
            type: string
actions:
  - { id: file, label: File it, tone: primary }
  - { id: revise, label: Revise, tone: neutral, note: optional }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
