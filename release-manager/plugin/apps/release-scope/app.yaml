# plugin/apps/release-scope/app.yaml — the tool app_release_scope.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Release scope
description: "Use at step 2, before proposing the version: shows the owner what the release would carry (each merged change with its risk and the readiness checks), lets them flag changes that must not ship, and returns whether to go on to the release card or stop."
mode: gate
input:
  type: object
  required: [title, changes]
  properties:
    title:
      type: string
      description: "<repository> <last tag>...<commit>."
    repo:
      type: string
    base:
      type: string
      description: The last tag.
    head:
      type: string
      description: The commit to release.
    changes:
      type: array
      items:
        type: object
        required: [id, title]
        properties:
          id:
            type: string
            description: PR number or short sha.
          title:
            type: string
          url:
            type: string
          author:
            type: string
          kind:
            type: string
            description: breaking, feature, fix or chore.
          risk:
            type: string
            description: high, medium or low.
    checks:
      type: array
      items:
        type: object
        required: [name]
        properties:
          name:
            type: string
          status:
            type: string
            description: pass, fail or pending.
          url:
            type: string
          detail:
            type: string
      description: Readiness checks from step 2.
actions:
  - { id: continue, label: Go on to sign-off, tone: primary }
  - { id: stop, label: Don't release, tone: danger, note: optional }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
    blockers:
      type: string
      title: Changes
      description: JSON array of the ids the owner flagged as blockers.
      maxLength: 8000
