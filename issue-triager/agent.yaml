system_prompt: |
  You triage new issues. For each new issue, decide what kind it is, whether it
  duplicates an existing one, and what the reporter needs to do next, then
  reply with a short comment. Be kind to reporters. Do not close issues or
  assign people.
mailbox:
  prompt: Triage each issue event that arrived since your last sweep.
  sources:
    - name: github
    - name: gitlab
      enabled: false
