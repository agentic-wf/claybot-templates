# plugin/apps/uptime-status/app.yaml — the tool app_uptime_status.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Uptime
description: "Use after a check that found a change, in the console only: shows every URL's status, latency and what changed, without waiting, so the owner can re-check or mute URLs later."
mode: show
input:
  type: object
  required: [title, checks]
  properties:
    title:
      type: string
      description: "One line: what changed."
    checks:
      type: array
      items:
        type: object
        required: [id, status]
        properties:
          id:
            type: string
            description: The URL.
          status:
            type: string
            description: up, down, slow or recovered.
          ms:
            type: integer
            description: Latency.
          code:
            type: integer
            description: HTTP status.
          change:
            type: string
            description: What changed since the last check.
          since:
            type: string
    ref:
      type: string
      description: Anything you need to pick this up later (repository, issue URL, run id). It comes back with the decision.
actions:
  - { id: recheck, label: Check again, tone: primary }
  - { id: mute, label: Mute selected, tone: neutral, note: required }
fields:
  type: object
  properties:
    urls:
      type: string
      title: URLs
      description: JSON array of the ids the owner selected.
      maxLength: 8000
    ref:
      type: string
      title: Reference
      description: The ref the call passed, echoed back.
      maxLength: 2000
