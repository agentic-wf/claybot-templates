# plugin/apps/error-fix/app.yaml — the tool app_error_fix.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Error investigation
description: "Use after writing an error's investigation note, in the console only: shows the owner the cause, the stack frames, the change that introduced it and the proposed patch, without waiting, so they can ask for a draft pull request later."
mode: show
input:
  type: object
  required: [title, cause]
  properties:
    title:
      type: string
      description: The error, one line.
    url:
      type: string
      description: The Sentry issue.
    release:
      type: string
    culprit:
      type: string
      description: "file:line where it is thrown."
    cause:
      type: string
      description: The root cause from step 3, Markdown.
    frames:
      type: array
      items:
        type: object
        required: [name]
        properties:
          name:
            type: string
            description: "function (file:line)"
          detail:
            type: string
            description: The line of code.
          url:
            type: string
      description: The in-app frames, innermost first.
    suspect:
      type: array
      items:
        type: object
        required: [title]
        properties:
          title:
            type: string
          url:
            type: string
          author:
            type: string
          when:
            type: string
      description: The change from step 4.
    files:
      type: array
      items:
        type: object
        required: [path, patch]
        properties:
          path:
            type: string
          patch:
            type: string
            description: "Unified diff of this file, @@ headers included."
          url:
            type: string
          status:
            type: string
            description: added, modified, removed or renamed.
      description: The proposed fix as a diff.
    ref:
      type: string
      description: Anything you need to pick this up later (repository, issue URL, run id). It comes back with the decision.
actions:
  - { id: open_draft_pr, label: Open a draft PR, tone: primary, note: optional }
  - { id: dig, label: Dig deeper, tone: neutral, note: optional }
  - { id: not_a_bug, label: Not a bug, tone: neutral, note: required }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
    ref:
      type: string
      title: Reference
      description: The ref the call passed, echoed back.
      maxLength: 2000
