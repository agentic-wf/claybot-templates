# plugin/apps/pr-review/app.yaml — the tool app_pr_review.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Pull request review
description: "Use before posting a pull request review: shows the owner the findings with their diff hunks and every changed file, lets them drop findings, comment on lines and edit the summary, and returns whether to post."
mode: gate
input:
  type: object
  required: [title, url, findings]
  properties:
    title:
      type: string
      description: The pull request's title.
    url:
      type: string
      description: The pull request's URL.
    repo:
      type: string
      description: owner/name.
    number:
      type: integer
    author:
      type: string
    summary:
      type: string
      description: Your two or three sentence summary of the change, Markdown.
    verdict:
      type: string
      description: "Your one-word read: clean, minor or blocking."
    checks:
      type: array
      items:
        type: object
        required: [name]
        properties:
          name:
            type: string
          status:
            type: string
            description: pass, fail or pending.
          url:
            type: string
      description: CI checks.
    findings:
      type: array
      items:
        type: object
        required: [id, title]
        properties:
          id:
            type: string
            description: Stable id, echoed back in values.keep.
          title:
            type: string
            description: One line naming the problem.
          severity:
            type: string
            description: critical, high, medium or low.
          category:
            type: string
          confidence:
            type: integer
            description: "0-100, from the rubric."
          file:
            type: string
            description: Path in the repository.
          line:
            type: integer
            description: Line in the new file.
          url:
            type: string
            description: Link to the line on the forge.
          body:
            type: string
            description: Why it is a problem and what to do, in Markdown.
          suggestion:
            type: string
            description: Replacement code, when there is one.
          hunk:
            type: string
            description: "The unified diff hunk around the line, copied from git diff, @@ header included."
      description: Every finding you kept after scoring.
    files:
      type: array
      items:
        type: object
        required: [path, patch]
        properties:
          path:
            type: string
          patch:
            type: string
            description: "Unified diff of this file, @@ headers included."
          url:
            type: string
          status:
            type: string
            description: added, modified, removed or renamed.
      description: The changed files, at most 20.
actions:
  - { id: post, label: Post review, tone: primary }
  - { id: request_changes, label: Post as changes requested, tone: danger }
  - { id: hold, label: Don't post, tone: neutral }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
    summary:
      type: string
      title: Summary
      description: "The owner's edit; absent when unchanged."
      maxLength: 20000
    keep:
      type: string
      title: Findings
      description: JSON array of the ids the owner kept.
      maxLength: 8000
