# plugin/apps/notes-review/app.yaml — the tool app_notes_review.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Release notes
description: "Use when a release-notes draft is written, in the console only: shows the owner the notes rendered with the version you suggest, lets them comment on any line, and returns whether to open the CHANGELOG pull request, revise, or keep the draft."
mode: gate
input:
  type: object
  required: [title, notes]
  properties:
    title:
      type: string
      description: "<version> — <date>."
    repo:
      type: string
    range:
      type: string
      description: The tag range, like v1.4.0...main.
    notes:
      type: string
      description: The notes as step 5 writes them, Markdown.
actions:
  - { id: changelog_pr, label: Open CHANGELOG PR, tone: primary }
  - { id: revise, label: Revise, tone: neutral, note: optional }
  - { id: keep, label: Keep the draft, tone: neutral }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
