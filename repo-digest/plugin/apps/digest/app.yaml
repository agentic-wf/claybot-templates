# plugin/apps/digest/app.yaml — the tool app_digest.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Repo digest
description: "Use after writing the digest, in the console only: lists what merged, grouped, with risks flagged, without waiting, so the owner can pick changes for you to look at more closely."
mode: show
input:
  type: object
  required: [title, changes]
  properties:
    title:
      type: string
      description: "<repository> since <last digest>."
    changes:
      type: array
      items:
        type: object
        required: [id, title]
        properties:
          id:
            type: string
            description: PR number or short sha.
          title:
            type: string
          url:
            type: string
          author:
            type: string
          group:
            type: string
            description: The heading it sits under.
          risk:
            type: string
            description: "Set only when it carries one: high, medium or low."
    ref:
      type: string
      description: Anything you need to pick this up later (repository, issue URL, run id). It comes back with the decision.
actions:
  - { id: look, label: Look closer at selected, tone: primary, note: optional }
fields:
  type: object
  properties:
    changes:
      type: string
      title: Merged
      description: JSON array of the ids the owner selected.
      maxLength: 8000
    ref:
      type: string
      title: Reference
      description: The ref the call passed, echoed back.
      maxLength: 2000
