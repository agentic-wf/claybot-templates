# plugin/apps/docs-review/app.yaml — the tool app_docs_review.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Docs review
description: "Use before opening a documentation pull request: shows the owner each document you changed, rendered with the new passages marked and what was taken out, lets them comment on any passage and drop files, and returns whether to open the pull request."
mode: gate
input:
  type: object
  required: [title, docs]
  properties:
    title:
      type: string
      description: The merged pull request's title.
    url:
      type: string
      description: The merged pull request's URL.
    repo:
      type: string
    number:
      type: integer
    summary:
      type: string
      description: What changed in behaviour, and so in the docs, Markdown.
    docs:
      type: array
      items:
        type: object
        required: [path, after]
        properties:
          path:
            type: string
            description: Path of the document in the repository or workspace.
          reason:
            type: string
            description: "One line: what the change made wrong here."
          before:
            type: string
            description: "The document's Markdown before your edit; omit for a new file."
          after:
            type: string
            description: The document's Markdown with your edit, in full.
          url:
            type: string
          status:
            type: string
            description: added or changed.
      description: Every document you changed.
actions:
  - { id: open_pr, label: Open the docs PR, tone: primary }
  - { id: revise, label: Revise first, tone: neutral, note: optional }
  - { id: skip, label: Leave the docs, tone: neutral, note: optional }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
    files:
      type: string
      title: Documents
      description: JSON array of the ids the owner included.
      maxLength: 8000
